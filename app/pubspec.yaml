name: raasta_app
description: "RaastaAI citizen app: photo-based pothole and garbage reporting (pilot concept)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
