# Runs scripts/test.sh (API pytest, admin vitest/lint/build, Flutter analyze/test) on every push and PR.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run tests
        run: |
          if [ ! -f scripts/test.sh ]; then
            echo "scripts/test.sh not found. Create it to run your tests."
            exit 1
          fi
          bash scripts/test.sh
